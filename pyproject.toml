[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csc8830-ui"
dynamic = ["version"]
description = "Canonical design tokens for the CSc 8830 Computer Vision application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Component tests drive uploads through AppTest.file_uploader, first shipped in Streamlit 1.56.
dev = ["pytest>=8.0", "streamlit>=1.56,<2"]

[tool.setuptools.dynamic]
version = { attr = "csc8830_ui.version.KIT_VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
